[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "precious-metals-cot-capstone"
version = "0.1.0"
description = "Reproducible, point-in-time precious metals ETF research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4", "yfinance>=0.2.54,<1", "exchange-calendars>=4.8,<5",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "jupyter>=1.1,<2", "prek==0.5.10"]

[project.scripts]
capstone = "capstone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: opt-in end-to-end checks requiring external repositories or real data"]
